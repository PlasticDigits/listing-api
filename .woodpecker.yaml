# Product consumer: listing-api. Scanners from woodpecker-ci.yaml plus the
# repo's TypeScript build. `npm test` is a stub that exits 1 — do not call it.
# No Coolify uuid on this project (static/API hosting is not forge Compose).

when:
  - event: [push, manual]
    branch: main
  - event: pull_request

steps:
  - name: gitleaks
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    commands:
      - |
        set -euo pipefail
        apk add --no-cache curl git
        curl -fsSL -o /tmp/gitleaks.tgz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
        echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        chmod +x /tmp/gitleaks
        /tmp/gitleaks detect --source . --verbose --redact --exit-code 1

  - name: opengrep
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    commands:
      - |
        set -euo pipefail
        apk add --no-cache curl git
        curl -fsSL -o /tmp/opengrep \
          https://github.com/opengrep/opengrep/releases/download/v1.29.0/opengrep_musllinux_x86
        echo "1b474bf207905a3cffe4e915fe36895835bc89de2620cb2ffd88ca512d9ea31b  /tmp/opengrep" | sha256sum -c
        chmod +x /tmp/opengrep
        /tmp/opengrep scan --error --config .opengrep.yml .

  - name: build
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    commands:
      - npm ci
      - npm run build

  - name: trivy-fs
    image: woodpeckerci/plugin-trivy:1.2.0@sha256:8019658e562d06876fd8b3ac9640c20e0fd964e5fbac3a41856443f0d9d672ba
    settings:
      dir: .
      severity: HIGH,CRITICAL
      exit-code: 1
      skip-dirs: vendor,node_modules

  - name: telegram-failure
    image: appleboy/drone-telegram:1.3.0@sha256:a5198f0a17cfdef85a2b8f19d379bcbfd482db911a5c02fbc311a0067d82b3f0
    when:
      - status: [failure]
    settings:
      token:
        from_secret: telegram_bot_token
      to:
        from_secret: telegram_chat_id
      message: >-
        {{repo.owner}}/{{repo.name}} #{{build.number}} failed on {{build.branch}}
        ({{build.event}}).
